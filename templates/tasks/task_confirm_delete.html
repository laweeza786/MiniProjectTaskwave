{% extends 'base.html' %}
{% block title %}Delete Task - TaskWave{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-6 col-lg-5">
    <div class="tw-card text-center p-4">
      <div class="rounded-circle bg-danger-subtle text-danger mx-auto d-flex align-items-center justify-content-center mb-3" style="width: 56px; height: 56px; font-size: 1.5rem;">
        <i class="bi bi-trash"></i>
      </div>
      <h3 class="fw-bold mb-2">Delete Task?</h3>
      <p class="text-muted small mb-4">Are you sure you want to delete <strong>"{{ task.title }}"</strong>? This cannot be undone.</p>
      <form method="POST">
        {% csrf_token %}
        <div class="d-flex justify-content-center gap-2">
          <a href="{% url 'tasks:task_detail' task.id %}" class="btn btn-outline-secondary">Cancel</a>
          <button type="submit" class="btn btn-danger">Yes, Delete Task</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
